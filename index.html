<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="CineArch Mobile" />
    <meta name="theme-color" content="#000000" />
    <meta name="format-detection" content="telephone=no" />
    <title>CineArch Mobile</title>
    <meta name="description" content="A minimalist, editorial-grade platform for Canadian film workers to track union eligibility, log jobs, and manage documents." />
    <meta property="og:title" content="CineArch Mobile" />
    <meta property="og:description" content="A minimalist, editorial-grade platform for Canadian film workers to track union eligibility, log jobs, and manage documents." />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Spline+Sans:wght@300;400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
    
    <style>
      :root {
        --background: #000000; 
        --surface: #0a0a0a;
        --border: rgba(255, 255, 255, 0.08);
        --text-primary: #FFFFFF; 
        --text-secondary: #E5E5E5; 
        --text-tertiary: #A3A3A3;  
        --accent: #FACC15; 
        --sat: env(safe-area-inset-top, 0px);
        --sab: env(safe-area-inset-bottom, 0px);
        --sal: env(safe-area-inset-left, 0px);
        --sar: env(safe-area-inset-right, 0px);
      }

      * {
        -webkit-tap-highlight-color: transparent;
        touch-action: manipulation;
        box-sizing: border-box;
      }

      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        min-height: 100dvh;
        background-color: var(--background);
        color: var(--text-primary);
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        overflow-x: hidden;
      }

      /* iOS Safari Critical Rule: Prevent auto-zoom when tapping inputs */
      input, select, textarea {
        font-size: 16px !important;
      }

      .heading-huge {
        font-family: 'Instrument Serif', serif;
        font-size: clamp(2.2rem, 8.5vw, 4.4rem);
        line-height: 0.9;
        letter-spacing: -0.03em;
        font-style: italic;
        word-break: break-word;
      }

      .bg-cinematic-universal {
        position: fixed;
        inset: 0;
        z-index: -2;
        background-image: url("https://i.pinimg.com/1200x/f8/ae/1d/f8ae1d1629a7c473761391eb308986dd.jpg");
        background-size: cover;
        background-position: center;
        opacity: 0.1;
        filter: grayscale(1) contrast(1.3) blur(80px);
      }
      
      .bg-vignette-universal {
        position: fixed;
        inset: 0;
        z-index: -1;
        background: radial-gradient(circle at center, transparent 0%, black 100%);
        pointer-events: none;
      }

      .glass-ui {
        background: rgba(15, 15, 15, 0.55);
        backdrop-filter: blur(32px) saturate(180%);
        -webkit-backdrop-filter: blur(32px) saturate(180%);
        border: 1px solid rgba(255, 255, 255, 0.12);
      }

      .mobile-wrapper {
        width: 100%;
        max-width: 480px;
        margin: 0 auto;
        padding-left: max(env(safe-area-inset-left), 1rem);
        padding-right: max(env(safe-area-inset-right), 1rem);
      }

      .hide-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .hide-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }

      .ios-momentum-scroll {
        -webkit-overflow-scrolling: touch;
        overscroll-behavior-y: contain;
      }

      /* Mobile UI Overrides */
      .tap-active:active {
        background-color: rgba(255, 255, 255, 0.08);
        transform: scale(0.97);
        transition: transform 0.1s ease;
      }

      .pb-safe { padding-bottom: max(env(safe-area-inset-bottom), 16px); }
      .pt-safe { padding-top: max(env(safe-area-inset-top), 16px); }
    </style>

    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              background: 'var(--background)',
              surface: 'var(--surface)',
              accent: 'var(--accent)',
              textPrimary: 'var(--text-primary)', 
              textSecondary: 'var(--text-secondary)',
              textTertiary: 'var(--text-tertiary)',
            },
            fontFamily: {
              sans: ['Spline Sans', 'sans-serif'],
              serif: ['Instrument Serif', 'serif'],
            }
          }
        }
      }
    </script>
    <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.3",
    "react/": "https://esm.sh/react@^19.2.3/",
    "react-router-dom": "https://esm.sh/react-router-dom@^7.10.1",
    "lucide-react": "https://esm.sh/lucide-react@^0.561.0",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "clsx": "https://esm.sh/clsx@^2.1.1",
    "papaparse": "https://esm.sh/papaparse@^5.5.3",
    "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@2.39.0",
    "vite": "https://esm.sh/vite@^7.3.1",
    "@vitejs/plugin-react": "https://esm.sh/@vitejs/plugin-react@^5.1.2"
  }
}
</script>
  </head>
  <body class="dark bg-background text-textPrimary selection:bg-accent selection:text-black overscroll-none">
    <div class="bg-cinematic-universal"></div>
    <div class="bg-vignette-universal"></div>
    <div id="root"></div>
    <script type="module" src="./index.tsx"></script>
  </body>
</html>
